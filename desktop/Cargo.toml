[workspace]
resolver = "3"
members = ["crates/actas-core", "crates/actas-engine", "crates/actasd", "crates/actas"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
actas-core = { path = "crates/actas-core" }
actas-engine = { path = "crates/actas-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
directories = "6"
regex = "1"
tokio = { version = "1", features = ["full"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
