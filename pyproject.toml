[project]
name = "meetings-transcript"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.26.0",
    "botocore>=1.29.0",
    "openai-whisper>=20231106",
    "rapidfuzz>=3.14.0",
    "requests>=2.32.0",
    "textual>=6.6.0,<9",
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchvision~=0.23.0",
    "whisperx==3.8.6",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23.0",
    "moto>=4.1.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.25.0",
    "ruff>=0.15.0",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires provisioned local models or hardware",
]
